[project]
name = "kr-gmp-regulatory-agent"
version = "0.1.0"
description = "국내 GMP 법령·고시 기반 공정 엔지니어 조치 안내 에이전트 데모 (kordoc + Agentic RAG)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
kgmp = "kgmp_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgmp_agent"]
